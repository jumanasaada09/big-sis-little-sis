<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Big Sis Little Sis Finder</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 80px;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #eaf6ff 0%, #d5ecff 50%, #eaf6ff 100%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    color: #2a6ca3;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  h1 {
    text-align: center;
    font-size: 40px;
    color: #3579b3;
    text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #bfe3ff;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  p.subtitle {
    text-align: center;
    color: #5aa8e0;
    font-size: 16px;
    margin-bottom: 30px;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  input#searchInput {
    width: 100%;
    padding: 16px 22px;
    font-size: 18px;
    border-radius: 30px;
    border: 3px solid #a4d8ff;
    outline: none;
    background: #ffffff;
    color: #2a6ca3;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(90, 168, 224, 0.25);
  }

  input#searchInput:focus {
    border-color: #5aa8e0;
  }

  .suggestions {
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    background: #ffffff;
    border-radius: 20px;
    border: 2px solid #bfe3ff;
    box-shadow: 0 6px 16px rgba(90,168,224,0.25);
    overflow: hidden;
    z-index: 10;
    display: none;
  }

  .suggestions div {
    padding: 12px 22px;
    cursor: pointer;
    font-size: 16px;
    color: #3579b3;
  }

  .suggestions div:hover {
    background: #eaf6ff;
  }

  .card {
    display: none;
    background: #ffffff;
    border-radius: 24px;
    border: 3px solid #bfe3ff;
    box-shadow: 0 6px 18px rgba(90,168,224,0.25);
    padding: 26px 28px;
    margin-top: 10px;
  }

  .card h2 {
    margin: 0 0 4px;
    font-size: 26px;
    color: #2a6ca3;
  }

  .card .role-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(135deg, #7ec4f0, #5aa8e0);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .pair-banner {
    background: linear-gradient(135deg, #eaf6ff, #d5ecff);
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 20px;
    text-align: center;
  }

  .pair-banner .label {
    font-size: 13px;
    color: #5aa8e0;
    margin-bottom: 2px;
  }

  .pair-banner .pair-name {
    font-size: 22px;
    font-weight: bold;
    color: #2a6ca3;
  }

  .section-title {
    font-size: 15px;
    font-weight: bold;
    color: #5aa8e0;
    margin: 18px 0 8px;
    border-bottom: 2px dashed #bfe3ff;
    padding-bottom: 4px;
  }

  .info-row {
    display: flex;
    padding: 6px 0;
    font-size: 15px;
  }

  .info-row .info-label {
    width: 140px;
    min-width: 140px;
    color: #7ec4f0;
    font-weight: bold;
  }

  .info-row .info-value {
    color: #2a6ca3;
  }

  .no-match {
    display: none;
    text-align: center;
    color: #5aa8e0;
    font-size: 16px;
    margin-top: 20px;
  }

  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    border: 1px solid #bfe3ff;
  }
</style>

<div class="bubble" style="width:80px;height:80px;background:#bfe3ff;top:20px;left:5%;"></div>

</div>

const nameList = Object.keys(people);
const input = document.getElementById('searchInput');
const suggestionsBox = document.getElementById('suggestions');
const card = document.getElementById('card');
const noMatch = document.getElementById('noMatch');

function titleCase(str) {
  return str.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase());
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  suggestionsBox.innerHTML = '';
  if (!q) { suggestionsBox.style.display = 'none'; return; }
  const matches = nameList.filter(n => n.includes(q));
  if (matches.length === 0) { suggestionsBox.style.display = 'none'; return; }
  matches.slice(0, 6).forEach(n => {
    const div = document.createElement('div');
    div.textContent = titleCase(n);
    div.onclick = () => {
      input.value = titleCase(n);
      suggestionsBox.style.display = 'none';
      renderCard(n);
    };
    suggestionsBox.appendChild(div);
  });
  suggestionsBox.style.display = 'block';
}

function renderCard(key) {
  const person = people[key];
  if (!person) {
    card.style.display = 'none';
    noMatch.style.display = 'block';
    return;
  }
  noMatch.style.display = 'none';
  card.style.display = 'block';

  document.getElementById('personName').textContent = titleCase(key);
  document.getElementById('roleTag').textContent = person.role === 'big' ? 'BIG SIS' : 'LITTLE SIS';
  document.getElementById('personGrade').textContent = person.grade + 'th grade';
  document.getElementById('personColor').textContent = person.color;

  const pairKey = person.pair;
  const pairPerson = people[pairKey];
  const label = person.role === 'big' ? 'Your little sis is' : 'Your big sis is';
  document.getElementById('pairLabel').textContent = label;
  document.getElementById('pairName').textContent = titleCase(pairKey);

  document.getElementById('pairSectionTitle').textContent =
    (person.role === 'big' ? "Get to know your little sis" : "Get to know your big sis");

  document.getElementById('pairSnack').textContent = pairPerson.snack;
  document.getElementById('pairSalty').textContent = pairPerson.salty;
  document.getElementById('pairSweet').textContent = pairPerson.sweet;
  document.getElementById('pairDrinks').textContent = pairPerson.drinks;
  document.getElementById('pairColor').textContent = pairPerson.color;
  document.getElementById('pairMovie').textContent = pairPerson.movie;
}

input.addEventListener('input', (e) => {
  showSuggestions(e.target.value);
  card.style.display = 'none';
  noMatch.style.display = 'none';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = input.value.trim().toLowerCase();
    suggestionsBox.style.display = 'none';
    if (people[q]) {
      renderCard(q);
    } else {
      const partial = nameList.find(n => n.includes(q));
      if (partial) {
        input.value = titleCase(partial);
        renderCard(partial);
      } else {
        card.style.display = 'none';
        noMatch.style.display = 'block';
      }
    }
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    suggestionsBox.style.display = 'none';
  }
});
